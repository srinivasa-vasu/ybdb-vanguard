# ─────────────────────────────────────────────────────────────────────────────
# Lane B → A.  Reads site B's replication slot, writes to site A.
#
# The mirror of application-a2b.yml. Diff the two: every difference is a lane
# identity that MUST be distinct — slot, publication, offset table, apply-state
# table, origin prefix, HTTP port. Two lanes sharing any of them would corrupt
# each other's bookkeeping, and a shared origin prefix would additionally make
# the second lane fail to claim it (55006 object_in_use).
#
# Started with: bash applier.sh start b2a
# ─────────────────────────────────────────────────────────────────────────────

spring:
  application:
    name: cdc-b2a
  # SUBSCRIBER side of this lane: site A.
  datasource:
    url: jdbc:yugabytedb://${A_HOST:127.0.0.1}:5433/${DB_OBJECT:yugabyte}
    username: ${DB_USER:yugabyte}
    password: ${DB_SECRET:yugabyte}
    driver-class-name: com.yugabyte.Driver

server:
  port: ${B2A_PORT:8082}

# ── PUBLISHER side of this lane: site B ──────────────────────────────────────
producer:
  name: cdc-b2a
  connector-class: io.debezium.connector.postgresql.YugabyteDBConnector

  offset-storage: io.debezium.storage.jdbc.offset.JdbcOffsetBackingStore
  offset-storage-jdbc-url: jdbc:postgresql://${B_HOST:127.0.0.11}:5433/${DB_OBJECT:yugabyte}?currentSchema=${SCHEMA:public}
  offset-storage-jdbc-user: ${DB_USER:yugabyte}
  offset-storage-jdbc-password: ${DB_SECRET:yugabyte}
  offset-storage-jdbc-table: ${B2A_OFFSET_TABLE:cdc_offset_b2a}
  offset-flush-interval-ms: 10000

  hostname: ${B_HOST:127.0.0.11}
  port: 5433
  user: ${DB_USER:yugabyte}
  password: ${DB_SECRET:yugabyte}
  db-name: ${DB_OBJECT:yugabyte}

  plugin-name: yboutput
  replication-slot: ${B2A_SLOT:b2a_slot}
  publication-name: ${B2A_PUB:b2a_pub}
  publication-mode: filtered
  table-list: ${SCHEMA:public}.orders,${SCHEMA:public}.stock
  schema-list: ${SCHEMA:public}

  server-id: cdc-b2a
  server-name: cdc-b2a
  topic-prefix: cdc_b2a
  task-max: 1

  # See application-a2b.yml — a snapshot's rows carry no origin, so in a
  # two-way topology they would be echoed straight back.
  snapshot-mode: never

  timestamp-precision-mode: adaptive_time_microseconds
  log-errors-include-messages: true
  provide-transaction-metadata: true
  heartbeat-interval-ms: 10000
  poll-interval-ms: 100
  max-batch-size: 5000
  max-queue-size: 10000

# ── APPLY behaviour ──────────────────────────────────────────────────────────
consumer:
  enable-transaction-boundary: true
  transactions-per-commit: 1
  batch-size: 500
  max-buffered-rows: 50000
  flush-interval-ms: 2000
  drain-interval-ms: 30000

  apply-state-table: ${B2A_APPLY_STATE:cdc_apply_state_b2a}
  apply-state-schema: ${SCHEMA:public}

  unknown-columns: skipIfNull
  sink-recheck-interval-ms: 30000
  skip-applied-lsn: false

  # ── Conflict resolution: last-writer-wins on a timestamp column ──────────
  # Loop prevention stops changes circulating. It says nothing about two sites
  # writing the same row, and with `none` the result is permanent divergence:
  # each site applies the other's change last and keeps a different value.
  #
  # `timestamp` applies a change only when the sink row is OLDER, compared on a
  # column the table already carries. It works with no schema change and no
  # trigger precisely because the column is in the row: a local write maintains
  # it exactly as a replicated write does.
  #
  # It rests on the application setting that column on every UPDATE. A
  # `DEFAULT now()` fires on INSERT only — an UPDATE that forgets it leaves the
  # row's version stale and the guard will reject changes it should accept.
  conflict-resolution: timestamp
  # Candidates, matched per table against columns that exist with a time-like
  # type. Here: orders.last_modified and stock.updated_at. Each table logs the
  # column that guards it, and a table matching none logs that it is applied
  # unconditionally — "some tables are guarded" is a very different posture from
  # "all are", and otherwise invisible.
  conflict-columns: [updated_at, modified_at, last_modified, updated_on]
  # For a table naming its version column something else entirely:
  #   conflict-column-overrides:
  #     public.orders: placed_on

  # Equal timestamps would diverge if left alone — each side rejects the other's
  # change and keeps its own. `nodeId` settles it with a rule both sides
  # evaluate to the SAME answer: the change from the higher node id wins. The
  # ids are mirrored between the lanes (node/peer here is peer/node there), so
  # exactly one lane accepts a tie. Identical ids are rejected at startup,
  # because that reproduces the very divergence the tiebreak prevents.
  conflict-tiebreak: nodeId
  conflict-node-id: ${SITE_B_ID:b}
  conflict-peer-id: ${SITE_A_ID:a}

  # A rejection is a real edit being discarded. Off, that fact survives only as
  # a log line; on, it is queryable and can be reconciled. This is a conflict
  # LOG, not a dead-letter queue — nothing here should be replayed, because
  # last-writer-wins already decided.
  conflict-log: true
  conflict-log-table: ${B2A_CONFLICT_LOG:cdc_conflict_log_b2a}

  # Composes btoa_b2a_slot_1 and claims it on the apply connection, so every
  # row this lane writes into site A carries that origin in A's WAL.
  apply-origin-name: ${B2A_ORIGIN:btoa}

  # Symmetric with the A→B lane. Both lanes filtering is what makes the loop
  # terminate; switching this off on BOTH lanes is what makes it run forever.
  ignore-replicated-changes: true
  ignore-origins: []

logging:
  level:
    io.cdc.stream: INFO
